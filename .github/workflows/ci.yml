name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.13.8
      - run: uv sync --locked
      - run: uv run dbt parse
      - run: uv run dbt build
      - run: uv run ./scripts/test_incremental.sh